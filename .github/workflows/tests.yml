name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}


      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Set PYTHONPATH for src
        run: |
          echo "PYTHONPATH=$(pwd)/src" >> $GITHUB_ENV

      - name: Run tests
        run: pytest tests/ -v --ignore=tests/test_inject_attach.py -x
        env:
          PYTHONPATH: ${{ env.PYTHONPATH }}

      - name: Check import
        run: python -c "import nouse; print(f'nouse {nouse.__version__} imported successfully')"
